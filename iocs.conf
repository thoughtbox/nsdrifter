# Optional known-indicator layer for ns-drifter.sh.
#
# The tool's main job is generic: drift against a trusted baseline plus
# technique-based checks. Entries here only add "KNOWN IOC" findings in their
# own report section. Disable with -noiocs, or point IOC_FILE elsewhere.
# Indicators are per-campaign and often per-victim: absence means little.
#
# Format: one indicator per line, "<type> <value>", anything after the value
# is ignored (use it for a source note). Values contain no spaces; use
# [[:space:]] in regular expressions.
#   path     ERE matched against full paths (files, setuid sweep, scripts)
#   name     ERE matched against file names
#   sha256   file hash
#   ip       IPv4 address, matched in sockets and (stream mode) web/ns logs
#   user     NetScaler system user name (ns.conf)
#   content  ERE matched in file contents (marker roots, /flash/nsconfig, /etc)
#   log      ERE matched in ns.log, messages, httpaccess/httperror, bash.log
#   port     listening port or range (a-b)
# content, log and ip-in-log matching run in the collector and need
# COLLECT_MODE=stream (installed collectors use only their built-in checks).

# CVE-2019-19781: Fox-IT, LevelBlue SpiderLabs, Citrix IOC scanner
path     ^/var/tmp/netscaler/portal/templates(/.*)?$            template injection staging
path     ^/var/nstmp/\.nscache(/.*)?$                           NOTROBIN
path     ^/tmp/\.init(/.*)?$                                    NOTROBIN
path     ^/netscaler/portal/scripts/loadcolourprefs\.pl$        Perl backdoor (Fox-IT)

# CVE-2023-3519: CISA AA23-201A, Fox-IT/DIVD
path     ^/var/netscaler/gui/vpn/medialogininit\.png$           exfil staging (CISA)

# CVE-2025-6543: NCSC-NL
path     ^/var/netscaler/logon/a\.php$
path     ^/var/tmp/sh$                                          setuid shell
content  fnoc\.dptth|php\.xedni|relacsten|tnioPnogoL|gifnocsn|lufecarg[[:space:]]ltcehcapa|hs/pmt/rav/   reversed strings

